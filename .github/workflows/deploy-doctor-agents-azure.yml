name: Deploy Doctor Agents to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'HealthVerse-doctor-agents/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        working-directory: ./HealthVerse-doctor-agents
        run: pip install -r requirements.txt
        
      - name: Zip artifact for deployment
        working-directory: ./HealthVerse-doctor-agents
        run: zip ../release-doctor.zip ./* -r

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app-doctor
          path: release-doctor.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app-doctor

      - name: Unzip artifact for deployment
        run: unzip release-doctor.zip

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'healthverse-doctor'
          publish-profile: ${{ secrets.AZURE_DOCTOR_PUBLISH_PROFILE }}
