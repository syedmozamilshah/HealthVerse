name: Deploy Blazor UI to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'BlazorUI/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build BlazorUI --configuration Release

      - name: dotnet publish
        run: dotnet publish BlazorUI -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: blazor-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'healthverse-admin' # NOTE: User must change this to their actual Azure Web App name
          publish-profile: ${{ secrets.AZURE_BLAZOR_PUBLISH_PROFILE }}
          package: .
